appId: live.cyro.client
productName: CyRO
copyright: Copyright © CyRO

directories:
    output: dist/Desktop
    buildResources: applications/electron

files:
    - applications/electron/**/*
    - applications/api/**/*
    - applications/shared/**/*
    - src/**/*
    - node_modules/lodash-es/**/*
    - node_modules/bson/**/*
    - node_modules/rijndael-js/**/*
    - package.json

extraMetadata:
    main: applications/electron/main.js

asar: false

win:
    target:
        - dir
    icon: applications/electron/icon.png

linux:
    target:
        - dir
    icon: applications/electron/icon.png
    executableName: CyRO

mac:
    target:
        - dir
    icon: applications/electron/icon.png
